<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Choices Voices Packs</title>
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <style>
    html,body{width:100%;height:100%;margin:0;background:#09090b;color:#fff;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}
    .shell{height:100%;display:flex;flex-direction:column}
    .bar{height:44px;flex:0 0 44px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 12px;background:#121216;border-bottom:1px solid #28282f;box-sizing:border-box}
    .brand{display:flex;align-items:center;gap:9px;min-width:0;font-size:13px;font-weight:800}
    .brand span{width:10px;height:10px;border-radius:50%;background:#ffd54a;box-shadow:0 0 16px rgba(255,213,74,.55)}
    .brand strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .bar a{color:#ddd;text-decoration:none;font-size:11px;padding:7px 10px;border:1px solid #34343b;border-radius:8px;background:#1c1c22;white-space:nowrap}
    .bar a:hover{background:#292931;color:#fff}
    iframe{flex:1;width:100%;min-height:0;border:0;background:#fff}
  </style>
</head>
<body>
  <div class="shell">
    <div class="bar">
      <div class="brand"><span></span><strong>Choices Voices Packs</strong></div>
      <a href="https://choicervoicer.com/packs" target="_self" rel="noreferrer">Open direct</a>
    </div>
    <iframe src="https://choicervoicer.com/packs" title="Choicer Voicer Packs" allow="clipboard-read; clipboard-write; fullscreen" allowfullscreen></iframe>
  </div>
</body>
