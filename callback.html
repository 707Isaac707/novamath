<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Connecting TIDAL...</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#121212;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;text-align:center}.box{padding:30px}.spinner{width:34px;height:34px;border:4px solid #333;border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 18px}@keyframes spin{to{transform:rotate(360deg)}}</style>
</head><body><div class="box"><div class="spinner"></div><h2>Connecting TIDAL...</h2><p id="status">Finishing secure login.</p></div>
<script type="module">
import * as auth from 'https://unpkg.com/@tidal-music/auth@1.6.2/dist';
const CLIENT_ID='fAMpmPDN0cd2cE8F';
async function finish(){try{await auth.init({clientId:CLIENT_ID,credentialsStorageKey:'mediaHubTidalMobileV2',scopes:['search.read','playback','entitlements.read','user.read']});if(location.search)await auth.finalizeLogin(location.search);location.replace('/');}catch(e){console.error(e);document.getElementById('status').textContent='TIDAL login failed. Return to the site and try again.';}}
finish();
</script></body></html>
