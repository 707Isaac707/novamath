name: Import Nova Math ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Download latest Nova Math release ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/nova-release
          gh release download \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "*.zip" \
            --dir /tmp/nova-release

      - name: Extract Nova Math
        run: |
          mkdir -p /tmp/nova-src

          ZIP="$(find /tmp/nova-release -maxdepth 1 -name '*.zip' | head -n 1)"

          if [ -z "$ZIP" ]; then
            echo "No ZIP found in latest release"
            exit 1
          fi

          unzip -q "$ZIP" -d /tmp/nova-src

          shopt -s dotglob nullglob
          ITEMS=(/tmp/nova-src/*)

          if [ "${#ITEMS[@]}" -eq 1 ] && [ -d "${ITEMS[0]}" ]; then
            SOURCE="${ITEMS[0]}"
          else
            SOURCE="/tmp/nova-src"
          fi

          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.vercel/' \
            --exclude='.env' \
            --exclude='.env.*' \
            "$SOURCE"/ ./

          rm -rf .vercel

          {
            echo ".env"
            echo ".env.*"
            echo "!.env.example"
            echo ".vercel"
          } >> .gitignore

      - name: Commit Nova Math
        run: |
          git config user.name "Nova Math Importer"
          git config user.email "actions@github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Nothing new to commit"
          else
            git commit -m "Import Nova Math v1.3.2"
            git push
          fi
