name: Refresh Nova Sports Streams

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches:
      - main
    paths:
      - ".github/seleniumbase-run-now"

permissions:
  contents: read

concurrency:
  group: nova-sports-botasaurus
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check scraper secret
        id: configured
        env:
          BOTASAURUS_INGEST_SECRET: ${{ secrets.BOTASAURUS_INGEST_SECRET }}
        shell: bash
        run: |
          if [ -n "$BOTASAURUS_INGEST_SECRET" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "BOTASAURUS_INGEST_SECRET is not configured; skipping refresh."
          fi

      - name: Check out Nova Math
        if: steps.configured.outputs.enabled == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.configured.outputs.enabled == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: botasaurus-scraper/requirements.txt

      - name: Install Botasaurus scraper
        if: steps.configured.outputs.enabled == 'true'
        run: python -m pip install -r botasaurus-scraper/requirements.txt

      - name: Scrape, validate, and replace Vercel sports streams
        if: steps.configured.outputs.enabled == 'true'
        env:
          BOTASAURUS_INGEST_SECRET: ${{ secrets.BOTASAURUS_INGEST_SECRET }}
          BOTASAURUS_SPORTS_SOURCE_URLS: ${{ vars.BOTASAURUS_SPORTS_SOURCE_URLS }}
          SELENIUMBASE_SPORTS_SOURCE_URLS: ${{ vars.SELENIUMBASE_SPORTS_SOURCE_URLS }}
          SELENIUMBASE_RENDER_WAIT_SECONDS: "3"
          NOVA_SPORTS_INGEST_URL: https://novamath-three.vercel.app/api/sports-api?action=botasaurus-ingest
          BOTASAURUS_VALIDATE_STREAMS: "1"
          BOTASAURUS_VALIDATION_WORKERS: "48"
          BOTASAURUS_MAX_CANDIDATES: "1400"
          BOTASAURUS_MAX_STREAMS: "1000"
          BOTASAURUS_STREAM_TIMEOUT_SECONDS: "6"
          BOTASAURUS_SNAPSHOT_TTL_SECONDS: "3600"
        run: python botasaurus-scraper/scrape_and_push.py
