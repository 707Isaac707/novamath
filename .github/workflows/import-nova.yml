name: Import Nova Math v1.3.2

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nova-import-v1-3-2
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Download canonical v1.3.2 ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/nova-release
          gh release download v1.3.2 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "*.zip" \
            --dir /tmp/nova-release

      - name: Verify and extract Nova Math
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, pathlib, zipfile, stat, shutil

          zips = list(pathlib.Path('/tmp/nova-release').glob('*.zip'))
          if len(zips) != 1:
              raise SystemExit(f'Expected exactly one ZIP asset, found {len(zips)}')

          archive = zips[0]
          expected = '1fddb927e9680d43186bfd57f033ca24925ba7602f6ae96362392f7545f0bbbe'
          actual = hashlib.sha256(archive.read_bytes()).hexdigest()
          if actual != expected:
              raise SystemExit(f'ZIP checksum mismatch: {actual}')

          out = pathlib.Path('/tmp/nova-src')
          out.mkdir(parents=True, exist_ok=True)

          with zipfile.ZipFile(archive) as z:
              for item in z.infolist():
                  rel = pathlib.PurePosixPath(item.filename)

                  if rel.is_absolute() or '..' in rel.parts:
                      raise SystemExit(f'Unsafe ZIP path: {item.filename}')

                  if stat.S_ISLNK(item.external_attr >> 16):
                      raise SystemExit(f'Symlink rejected: {item.filename}')

                  if any(
                      part in {'.git', '.github', '.vercel', 'node_modules'}
                      or part.startswith('.env')
                      for part in rel.parts
                  ):
                      continue

                  dest = out.joinpath(*rel.parts)
                  if item.is_dir():
                      dest.mkdir(parents=True, exist_ok=True)
                  else:
                      dest.parent.mkdir(parents=True, exist_ok=True)
                      dest.write_bytes(z.read(item))

          required = [
              'index.html',
              'games.js',
              'sw.js',
              'package.json',
              'vercel.json',
              'server/vercel-bridge.mjs',
          ]
          missing = [p for p in required if not (out / p).is_file()]
          if missing:
              raise SystemExit(f'Missing project files: {missing}')

          functions = list((out / 'api').glob('*.mjs'))
          if len(functions) != 11:
              raise SystemExit(f'Expected 11 API functions, found {len(functions)}')

          print('Canonical Nova Math v1.3.2 ZIP verified successfully.')
          PY

      - name: Replace site with canonical project
        shell: bash
        run: |
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.gitignore' \
            /tmp/nova-src/ ./

          cat > .gitignore <<'EOF'
          .env
          .env.*
          !.env.example
          .vercel/
          node_modules/
          .DS_Store
          EOF

      - name: Check JavaScript syntax
        shell: bash
        run: |
          find . -maxdepth 1 -name '*.js' -print0 | xargs -0 -r -n1 node --check
          find api server -type f \( -name '*.mjs' -o -name '*.cjs' \) -print0 | xargs -0 -r -n1 node --check

      - name: Commit full Nova Math project
        shell: bash
        run: |
          git config user.name "Nova Math Importer"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Nova Math v1.3.2 is already imported."
          else
            git commit -m "Import complete Nova Math v1.3.2 project"
            git push origin HEAD:main
          fi
