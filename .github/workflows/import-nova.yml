name: Finalize Nova Math v1.3.2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-nova.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nova-finalize-v1-3-2
  cancel-in-progress: false

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore exact canonical backend bundle
        shell: bash
        run: |
          cat .nova-import/source.part1               .nova-import/source.part2               .nova-import/source.part3             | base64 -d > /tmp/nova-source.tar.gz

          gzip -t /tmp/nova-source.tar.gz
          echo "Canonical source archive contents:"
          tar -tzf /tmp/nova-source.tar.gz
          tar -xzf /tmp/nova-source.tar.gz -C .

      - name: Apply exact full v1.3.2 patch
        shell: bash
        run: |
          cat .nova-import/patch.part1 \
              .nova-import/patch.part2 \
              .nova-import/patch.part3 \
              .nova-import/patch.part4 \
            | base64 -d | gunzip > /tmp/all-v132.patch

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("/tmp/all-v132.patch")
          text = p.read_text()
          # v1.2 index.html had no final newline, so the next diff header was
          # attached to </html>. Restore the missing separator.
          text = re.sub(r"(?<!\\n)(--- a/)", r"\\n\\1", text)
          p.write_text(text)
          PY

          # GNU patch correctly handles the v1.2 index.html no-final-newline
          # hunk (with fuzz 1) after the separator repair above.
          patch --batch --forward -p1 < /tmp/all-v132.patch

          echo '' \
            | base64 -d > NOVA-MATH-V1.3.2.txt

      - name: Remove temporary import files
        shell: bash
        run: |
          rm -rf .nova-import
          rm -rf ".github/    .github"
          find . -type f \( -name '*.orig' -o -name '*.rej' \) -delete

      - name: Validate v1.3.2 hashes and structure
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          expected = {
              "DEPLOY-VERCEL-DROP.txt": "299372beeeb437513aa37de5e5e16a48f4529a0d4571d3d99ecfd57b42156b7b",
              "ENVIRONMENT-VARIABLES.txt": "7b5287655eb928260b4c3a8b805b014c7d925953401524bf4cbeb0312745611a",
              "enhancements.js": "936ff7953fdd2258fd1a6a4540d0683565a35891ce7a3b90e10723b3f05ade4b",
              "index.html": "e499e0559d67c11f863a0f16e53d06c8f9217b66945852ef6e8853717c3f55a2",
              "nova-v1.css": "37761754a74d157bc3228faeeb577ce1a0c325fda2e1df22dd9f8bcae58f7c11",
              "package.json": "3f926199f997420943eac8cd6a1a0b5c649ab2264c2955485033125432f913b9",
              "platform-v69.js": "d43532def7277f9a6608966fd8fb354e91f60ae9644aefc263f1d1adc5695971",
              "server/functions/assistant.cjs": "bf15d48bd58ca76236520b8526abe08384a7b5e96aaebb1b5a982dad3484c96c",
              "server/functions/game-art.cjs": "9038b1ca6bbe31d26213b424f70ca8e63a8fb99ea743eefc4759057e6cc3464b",
              "server/functions/platform-api.cjs": "55d22a4ef58ee1c4e77de6dd8237152b5ded9a22b0d2539d42590d3ecb7b5bd6",
              "sw.js": "2e7efc128a305eba1d563deafc02398f144dd27fa03d1e8ac584682d46560ae5",
              "NOVA-MATH-V1.3.2.txt": "a7b3b7e072733b530b67babcf3f8f4d77958517d3956ddd4ab13af1b674c618d",
          }

          bad = []
          for path, wanted in expected.items():
              p = Path(path)
              if not p.is_file():
                  bad.append(f"{path}: missing")
                  continue
              actual = hashlib.sha256(p.read_bytes()).hexdigest()
              if actual != wanted:
                  bad.append(f"{path}: {actual} != {wanted}")

          if bad:
              raise SystemExit("v1.3.2 hash validation failed:\n" + "\n".join(bad))

          api = list(Path("api").glob("*.mjs"))
          docs = [p for p in Path("docs").iterdir() if p.is_file()]
          server = [p for p in Path("server").rglob("*") if p.is_file()]

          if len(api) != 11:
              raise SystemExit(f"Expected 11 API functions, found {len(api)}")
          if len(docs) != 2001:
              raise SystemExit(f"Expected 2001 docs files, found {len(docs)}")
          if len(server) != 13:
              raise SystemExit(f"Expected 13 server files, found {len(server)}")

          print("Nova Math v1.3.2 hashes verified.")
          print("API functions:", len(api))
          print("Docs files:", len(docs))
          print("Server files:", len(server))
          PY

          node --check enhancements.js
          node --check platform-v69.js
          node --check sw.js
          find api server -type f \( -name '*.mjs' -o -name '*.cjs' \) -print0 | xargs -0 -n1 node --check

          ! grep -R -n -E 'BasicallyNoobYT|Basically Noob'               --exclude-dir=.git --exclude-dir=.github . || exit 1
          ! grep -R -n -E 'WEB-HOOK|WEB_HOOK'               --exclude-dir=.git --exclude-dir=.github . || exit 1

          grep -q 'FOOD_REQUEST_DISCORD_WEBHOOK' ENVIRONMENT-VARIABLES.txt
          grep -q 'NOVA_REPORTS_WEBHOOK' ENVIRONMENT-VARIABLES.txt
          grep -q 'NOVA_ADMIN_ALERTS_WEBHOOK' ENVIRONMENT-VARIABLES.txt
          grep -q "BUILD='1.3.2'" platform-v69.js
          grep -q 'novamath-shell-v1-3-2-hobby-1' sw.js

      - name: Commit canonical v1.3.2
        shell: bash
        run: |
          git config user.name "Nova Math Importer"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nova Math v1.3.2 is already canonical."
          else
            git commit -m "Finalize canonical Nova Math v1.3.2"
            git push origin HEAD:main
          fi

# retry-after-patch-restore
