name: Finalize Nova Math v1.3.2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-nova.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nova-finalize-v1-3-2
  cancel-in-progress: false

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Rebuild and repair exact v1.3.2 patch
        shell: bash
        run: |
          cat .nova-import/patch.part1               .nova-import/patch.part2               .nova-import/patch.part3               .nova-import/patch.part4             | base64 -d | gunzip > /tmp/v132.patch

          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("/tmp/v132.patch")
          text = p.read_text()
          # v1.2 index.html had no final newline, so the next diff header was
          # attached to </html>. Restore the missing separator generically.
          text = re.sub(r"(?<!\n)(--- a/)", r"\n\1", text)
          p.write_text(text)
          PY

          git apply --check /tmp/v132.patch
          git apply /tmp/v132.patch

          echo ''             | base64 -d > NOVA-MATH-V1.3.2.txt

          rm -rf .nova-import
          rm -rf ".github/    .github"

      - name: Validate canonical Nova Math project
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          api = list(Path("api").glob("*.mjs"))
          docs = [p for p in Path("docs").iterdir() if p.is_file()]
          required = [
              "index.html",
              "games.js",
              "sw.js",
              "package.json",
              "vercel.json",
              "server/vercel-bridge.mjs",
              "NOVA-MATH-V1.3.2.txt",
          ]
          missing = [p for p in required if not Path(p).is_file()]
          if missing:
              raise SystemExit(f"Missing required files: {missing}")
          if len(api) != 11:
              raise SystemExit(f"Expected 11 API functions, found {len(api)}")
          if len(docs) != 2001:
              raise SystemExit(f"Expected 2001 docs files, found {len(docs)}")
          print("Nova Math v1.3.2 structure verified.")
          print("API functions:", len(api))
          print("Docs files:", len(docs))
          PY

          node --check enhancements.js
          node --check platform-v69.js
          node --check sw.js
          node --check server/functions/assistant.cjs
          node --check server/functions/game-art.cjs
          node --check server/functions/platform-api.cjs

          ! grep -R -n -E 'BasicallyNoobYT|Basically Noob'               --exclude-dir=.git --exclude-dir=.github . || exit 1

          ! grep -R -n -E 'WEB-HOOK|WEB_HOOK'               --exclude-dir=.git --exclude-dir=.github . || exit 1

          grep -q 'FOOD_REQUEST_DISCORD_WEBHOOK' ENVIRONMENT-VARIABLES.txt
          grep -q 'NOVA_REPORTS_WEBHOOK' ENVIRONMENT-VARIABLES.txt
          grep -q 'NOVA_ADMIN_ALERTS_WEBHOOK' ENVIRONMENT-VARIABLES.txt
          grep -q "BUILD='1.3.2'" platform-v69.js
          grep -q 'novamath-shell-v1-3-2-hobby-1' sw.js

      - name: Commit finalized v1.3.2
        shell: bash
        run: |
          git config user.name "Nova Math Importer"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nova Math v1.3.2 already finalized."
          else
            git commit -m "Finalize Nova Math v1.3.2"
            git push origin HEAD:main
          fi
