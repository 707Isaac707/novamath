name: Bootstrap Nova Math from production

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-nova.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nova-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download public Nova Math library
        shell: bash
        run: |
          python3 - <<'PY'
          import json, pathlib, re, time
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from urllib.parse import quote
          from urllib.request import Request, urlopen

          BASE = "https://www.totallynovamath.duckdns.org/"
          root = pathlib.Path(".").resolve()

          public_files = [
            "nova-v1.js",
            "assets/vine-boom.wav",
            "assets/secret-6753.jpg",
            "assets/nova-logo.png",
            "assets/retro-bowl-hero.mp4",
            "assets/retro-bowl-hero-poster.jpg",
            "platform.css",
            "nova-v1.css",
            "native-apps.css",
            "DEPLOY-VERCEL-DROP.txt",
            "manifest.webmanifest",
            "platform-v69.js",
            "callback.html",
            "apps/choices-voices-packs.html",
            "sw.js",
            "sports-v69.css",
            "v68-ui.css",
            "app-icon-192.png",
            "enhancements.css",
            "v70-chromebook.css",
            "social.js",
            "platform-v69.css",
            "classroom-icon.svg",
            "app-icon-512.png",
            "SOCIAL-SETUP.txt",
            "v68-ui.js",
            "SCRAMJET-BACKEND.txt",
            "social.css",
            "watch-party.css",
            "enhancements.js",
            "REMOVED-BROKEN-GAMES.txt",
            "ENVIRONMENT-VARIABLES.txt",
            "NOVA-MATH-V1.2.txt",
            "style.css",
            "native-apps.js",
            "sports-v69.js",
            "watch-party.js",
            "platform.js",
            "games.js",
            "index.html",
          ]

          def fetch_bytes(path):
              url = BASE + quote(path, safe="/")
              last = None
              for attempt in range(4):
                  try:
                      req = Request(url, headers={"User-Agent": "NovaMath-GitHub-Importer/1.0"})
                      with urlopen(req, timeout=90) as r:
                          if r.status != 200:
                              raise RuntimeError(f"HTTP {r.status}")
                          return r.read()
                  except Exception as e:
                      last = e
                      time.sleep(1.5 * (attempt + 1))
              raise RuntimeError(f"Failed {path}: {last}")

          # Get games.js first so the game list itself defines the main docs set.
          games = fetch_bytes("games.js")
          (root / "games.js").write_bytes(games)
          text = games.decode("utf-8")
          m = re.search(r"window\.BUILT_IN_GAMES\s*=\s*(\[.*?\]);?\s*$", text, re.S)
          if not m:
              raise SystemExit("Could not parse BUILT_IN_GAMES")
          catalog = json.loads(m.group(1))
          docs = {g["file"] for g in catalog if isinstance(g.get("file"), str) and g["file"].startswith("docs/")}
          docs.update({
              "docs/clhextris.html",
              "docs/clmariominusrabbids.html",
              "docs/clonenightasfreddy.html",
              "docs/clsmashkarts.html",
              "docs/clsuperkidadventure.htm",
              "docs/cltanukisunset.html",
              "docs/clthrowapotato.html",
              "docs/fd.html",
              "docs/shotgun-mario-64-rom.zip",
          })

          targets = sorted((set(public_files) - {"games.js"}) | docs)
          print(f"Downloading {len(targets)} production files...")

          def save(path):
              data = fetch_bytes(path)
              dest = root.joinpath(*pathlib.PurePosixPath(path).parts)
              dest.parent.mkdir(parents=True, exist_ok=True)
              dest.write_bytes(data)
              return path, len(data)

          failures = []
          total = 0
          with ThreadPoolExecutor(max_workers=16) as pool:
              futs = {pool.submit(save, p): p for p in targets}
              for idx, fut in enumerate(as_completed(futs), 1):
                  path = futs[fut]
                  try:
                      _, size = fut.result()
                      total += size
                  except Exception as e:
                      failures.append(f"{path}: {e}")
                  if idx % 200 == 0:
                      print(f"Completed {idx}/{len(targets)}")

          if failures:
              print("\n".join(failures[:50]))
              raise SystemExit(f"{len(failures)} downloads failed")

          # Preserve the two empty marker files from the canonical ZIP.
          (root / "docs").mkdir(exist_ok=True)
          (root / "docs/.gitkeep").touch()
          (root / "thumbs").mkdir(exist_ok=True)
          (root / "thumbs/.gitkeep").touch()

          actual_docs = [p for p in (root / "docs").iterdir() if p.is_file()]
          if len(actual_docs) != 2001:
              raise SystemExit(f"Expected 2001 docs files, found {len(actual_docs)}")

          print(f"Downloaded {len(targets)} files, {total} bytes. Docs count verified: 2001.")
          PY

      - name: Commit production library
        shell: bash
        run: |
          git config user.name "Nova Math Importer"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Production library already present."
          else
            git commit -m "Import Nova Math production library"
            git push origin HEAD:main
          fi
